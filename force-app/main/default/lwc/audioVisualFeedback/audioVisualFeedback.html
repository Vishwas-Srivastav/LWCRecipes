<template>
    <lightning-card title="Recipe: Visual Flash Feedback" icon-name="utility:announcement">
        <div class="slds-p-around_medium">
            <div class="recipe-banner slds-m-bottom_medium">
                <p class="recipe-title"><strong>Pattern: Visual Flash & Real-Time Alert Feedback</strong></p>
                <p class="recipe-description">
                    Demonstrates triggering visual CSS pulse/flash animations upon data updates.
                </p>
            </div>

            <div class={alertClass}>
                <p>Status: {statusMessage}</p>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button label="Simulate Status Change" variant="brand" onclick={handleSimulate}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
