<template>
    <lightning-card title="Recipe: File Upload & Attachment Tracker" icon-name="utility:upload">
        <div class="slds-p-around_medium">
            <div class="recipe-banner slds-m-bottom_medium">
                <p class="recipe-title"><strong>Pattern: Lightning File Upload Handler</strong></p>
                <p class="recipe-description">
                    Demonstrates uploading files attached to a record and tracking uploaded document titles in real-time.
                </p>
            </div>

            <lightning-file-upload
                label="Attach Files"
                name="fileUploader"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}
                multiple
            ></lightning-file-upload>

            <template if:true={hasUploadedFiles}>
                <div class="slds-m-top_medium">
                    <p><strong>Uploaded Documents ({uploadedFilesCount}):</strong></p>
                    <ul class="slds-list_dotted slds-m-top_x-small">
                        <template for:each={uploadedFiles} for:item="file">
                            <li key={file.documentId}>{file.name}</li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
