<template>
    <lightning-card title="Recipe: Paginated Data Table" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <!-- Documentation Banner -->
            <div class="recipe-banner slds-m-bottom_medium">
                <p class="recipe-title"><strong>Pattern: Server & Client-side Paginated Data Table</strong></p>
                <p class="recipe-description">
                    Demonstrates server-side pagination with dynamic page sizes, reactive @wire Apex data binding,
                    search filtering, custom column sorting, and event dispatching upon row selection.
                </p>
            </div>

            <!-- Controls: Search Input & Page Size Selector -->
            <div class="slds-grid slds-gutters slds-m-bottom_small slds-grid_vertical-align-center">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="search"
                        label="Search Accounts"
                        placeholder="Search by Name or Industry..."
                        value={searchKey}
                        onchange={handleSearchKeyChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                    <lightning-combobox
                        name="pageSize"
                        label="Records Per Page"
                        value={pageSizeStr}
                        options={pageSizeOptions}
                        onchange={handlePageSizeChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-text-align_right slds-m-top_medium">
                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                    ></lightning-button>
                </div>
            </div>

            <!-- Loading Spinner / Datatable -->
            <template if:true={isLoading}>
                <div class="spinner-container">
                    <lightning-spinner alternative-text="Loading data" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasRecords}>
                    <lightning-datatable
                        key-field="Id"
                        data={pagedData}
                        columns={columns}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        onrowaction={handleRowAction}
                        max-row-selection="1"
                        onrowselection={handleRowSelection}
                    ></lightning-datatable>
                </template>

                <template if:false={hasRecords}>
                    <div class="slds-illustration slds-illustration_small slds-m-around_medium">
                        <div class="slds-text-longform">
                            <h3 class="slds-text-heading_medium">No Accounts Found</h3>
                            <p class="slds-text-body_regular">Try adjusting your search criteria or page options.</p>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Pagination Toolbar -->
            <div class="slds-grid slds-grid_align-spread slds-m-top_medium slds-grid_vertical-align-center">
                <div class="slds-col">
                    <p class="slds-text-body_small slds-text-color_weak">
                        Page {pageNumber} of {totalPages} ({totalRecords} Total Records)
                    </p>
                </div>
                <div class="slds-col">
                    <lightning-button-group>
                        <lightning-button
                            label="First"
                            icon-name="utility:left"
                            disabled={isFirstPage}
                            onclick={handleFirstPage}
                        ></lightning-button>
                        <lightning-button
                            label="Previous"
                            icon-name="utility:chevronleft"
                            disabled={isFirstPage}
                            onclick={handlePreviousPage}
                        ></lightning-button>
                        <lightning-button
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            disabled={isLastPage}
                            onclick={handleNextPage}
                        ></lightning-button>
                        <lightning-button
                            label="Last"
                            icon-name="utility:right"
                            icon-position="right"
                            disabled={isLastPage}
                            onclick={handleLastPage}
                        ></lightning-button>
                    </lightning-button-group>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
